sources:
  propertyfinder:
    enabled: true
    mode: http-browser-sitemap
    start_url: https://www.propertyfinder.ae/en/buy/dubai/apartments-for-sale.html
    max_pages: 1
  bayut:
    enabled: true
    mode: http-browser
    start_url: https://www.bayut.com/for-sale/apartments/dubai/
    max_pages: 1
  dubizzle:
    enabled: true
    mode: http-browser
    start_url: https://dubai.dubizzle.com/property-for-sale/residential/apartment/
    max_pages: 1

  # DLD current-year surfaces. Keep disabled until a stable official export URL is
  # configured; the public search forms are CAPTCHA-gated.
  dld:
    enabled: false
    mode: official-csv
    url: null
  dld_rents:
    enabled: false
    mode: official-ejari-csv
    url: null
  dld_projects:
    enabled: false
    mode: official-project-csv
    url: null

  # Dubai Pulse is DLD's official historical/open-data backend. Implementation is
  # ready but remains disabled until OAuth credentials or approved CSV resources are configured.
  dubai_pulse_transactions:
    enabled: false
    mode: oauth-api-or-csv
    url: null
    limit: 1000
  dubai_pulse_rents:
    enabled: false
    mode: oauth-api-or-csv
    url: null
    limit: 1000
  dubai_pulse_projects:
    enabled: false
    mode: oauth-api-or-csv
    url: null
    limit: 1000
  dubai_pulse_registry:
    enabled: false
    mode: oauth-api
    entity_type: building
    limit: 1000

  # Secondary aggregate market context; never supersedes DLD transaction evidence.
  dxbinteract:
    enabled: true
    mode: public-market-report
    start_url: https://dxbinteract.com/market-reports/2026/Q2
    max_pages: 1

  # Public auction inventory used as a distress/motivated-sale signal source.
  emirates_auction:
    enabled: true
    mode: public-auction-pages
    start_url: https://www.emiratesauction.com/auction-calendar
    max_pages: 1

http:
  timeout_seconds: 20
  retries: 3
  backoff_seconds: 0.5
  rate_limit_per_second: 1
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
  browser_timeout_seconds: 30

canonicalization: {fuzzy_threshold: 92, ambiguity_margin: 4}
layouts: {absolute_area_sqft: 75, percentage_area: 0.06}
comp_windows_days: [30, 90, 180, 365]
acquisition: {transfer_fee_pct: 0.04, agent_fee_pct: 0.02, mortgage_registration_pct: 0.0025, trustee_fee_aed: 4200, valuation_fee_aed: 3000}
financing: {down_payment_pct: 0.25, annual_interest_rate: 0.0399, term_years: 25, loan_fee_pct: 0.01}
rental: {vacancy_pct: 0.08, maintenance_pct: 0.05, service_charge_aed_sqft: 15, str_management_fee: 0.17}
scoring_weights: {valuation: 0.45, distress: 0.20, investment: 0.35}
thresholds: {minimum_comp_count: 2, candidate_score: 55, distress_discount_pct: 0.10}
all_in_ceiling_aed: 2200000
allowed_bedrooms: [1, 2]
