[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[project]
name = "property-hunt"
version = "0.1.0"
description = "Auditable UAE residential property research pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic==2.11.7", "PyYAML==6.0.2", "typer==0.16.0", "httpx==0.28.1", "pyarrow==20.0.0", "rapidfuzz==3.13.0"]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.5", "mypy==1.17.0"]
browser = ["nodriver==0.50.3", "playwright==1.54.0"]
[project.scripts]
property-hunt = "property_hunt.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/property_hunt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
