name: daily-property-hunt

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # 07:00 UAE / 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-property-hunt
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,browser]'
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'No system Chrome/Chromium found on runner.' >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
          python -c 'import nodriver; print("nodriver import ok")'

      - name: Probe published sitemap endpoints
        run: |
          python - <<'PY'
          import httpx
          from xml.etree import ElementTree

          endpoints = {
              'propertyfinder': 'https://www.propertyfinder.ae/sitemaps/index-sitemap.xml',
              'bayut': 'https://www.bayut.com/sitemap_index.xml',
              'dubizzle': 'https://dubai.dubizzle.com/sitemaps/sitemap.xml',
          }
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; property-hunt-sitemap-check/1.0)'}

          def locs(payload: bytes):
              root = ElementTree.fromstring(payload)
              return [node.text.strip() for node in root.iter()
                      if node.tag.rsplit('}', 1)[-1] == 'loc' and node.text]

          with httpx.Client(headers=headers, follow_redirects=True, timeout=20) as client:
              for name, url in endpoints.items():
                  try:
                      r = client.get(url)
                      print(f'SITEMAP {name}: status={r.status_code} type={r.headers.get("content-type")} bytes={len(r.content)}')
                      if 'xml' in (r.headers.get('content-type') or '').lower():
                          found = locs(r.content)
                          print(f'SITEMAP {name} CHILDREN ({len(found)}): {found}')
                      else:
                          print(f'SITEMAP {name} snippet={r.text[:240].replace(chr(10), " ")!r}')
                  except Exception as exc:
                      print(f'SITEMAP {name}: ERROR {exc}')

              for probe in [
                  'https://www.propertyfinder.ae/sitemaps/buy-0.xml',
                  'https://www.bayut.com/lpv-sale-sitemap.xml',
              ]:
                  try:
                      r = client.get(probe)
                      found = locs(r.content) if 'xml' in (r.headers.get('content-type') or '').lower() else []
                      print(f'CHILD {probe}: status={r.status_code} urls={len(found)} first={found[:20]}')
                  except Exception as exc:
                      print(f'CHILD {probe}: ERROR {exc}')
          PY

      - name: Validate deterministic pipeline
        run: |
          ruff check src tests scripts
          pytest --cov=property_hunt --cov-report=term-missing
          property-hunt run \
            --config config/hunt.yaml \
            --fixture-dir tests/fixtures \
            --output-dir /tmp/property-hunt-check \
            --no-browser \
            --verbose
          python scripts/validate_artifacts.py /tmp/property-hunt-check

      - name: Run live collection
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' \
            property-hunt run \
              --config config/hunt.yaml \
              --output-dir . \
              --verbose

      - name: Validate generated artifacts
        run: |
          python scripts/validate_artifacts.py .
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/latest.json').read_text())
          counts = report.get('counts', {})
          if counts.get('collected_listings', 0) <= 0:
              diagnostics = report.get('diagnostics', [])
              raise SystemExit(f"live collection produced zero listings: {diagnostics}")
          PY

      - name: Persist daily state and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          if git diff --cached --quiet; then
            echo 'No generated data/report changes to commit.'
            exit 0
          fi
          git commit -m "property hunt: $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-hunt-${{ github.run_id }}
          path: |
            reports/
            data/state/
          if-no-files-found: warn
          retention-days: 3
