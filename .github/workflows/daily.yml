name: property-hunt-validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-hunt-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: ruff check src tests scripts
      - name: Deterministic fixture smoke test
        run: >-
          property-hunt run
          --config config/hunt.yaml
          --fixture-dir tests/fixtures
          --output-dir /tmp/property-hunt
          --no-browser
          --verbose
      - name: Validate artifacts
        run: python scripts/validate_artifacts.py /tmp/property-hunt
      - name: Upload validated fixture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: property-hunt-fixture-${{ github.run_id }}
          path: /tmp/property-hunt
          if-no-files-found: error
          retention-days: 7
