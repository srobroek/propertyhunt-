name: daily-property-hunt

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # 07:00 UAE / 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-property-hunt
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install project and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,browser]'
          playwright install --with-deps chromium

      - name: Build Rod browser helper
        run: |
          mkdir -p bin
          go mod tidy
          go build -o bin/rod-fetch ./tools/rod-fetch
          CHROME_BIN="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "PROPERTY_HUNT_ROD_BIN=$GITHUB_WORKSPACE/bin/rod-fetch" >> "$GITHUB_ENV"
          ./bin/rod-fetch --help >/dev/null

      - name: Validate deterministic pipeline
        run: |
          ruff check src tests scripts
          pytest --cov=property_hunt --cov-report=term-missing
          property-hunt run \
            --config config/hunt.yaml \
            --fixture-dir tests/fixtures \
            --output-dir /tmp/property-hunt-check \
            --no-browser \
            --verbose
          python scripts/validate_artifacts.py /tmp/property-hunt-check

      - name: Run live collection
        run: |
          property-hunt run \
            --config config/hunt.yaml \
            --output-dir . \
            --verbose

      - name: Validate generated artifacts
        run: |
          python scripts/validate_artifacts.py .
          git diff --check

      - name: Persist daily state and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          if git diff --cached --quiet; then
            echo 'No generated data/report changes to commit.'
            exit 0
          fi
          git commit -m "property hunt: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-hunt-${{ github.run_id }}
          path: |
            reports/
            data/state/
          if-no-files-found: warn
          retention-days: 3
