name: daily-property-hunt

on:
  push:
    branches: [main] # temporary full-pipeline verification trigger
  schedule:
    - cron: '0 3 * * *' # 07:00 UAE / 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-property-hunt
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,browser]'
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'No system Chrome/Chromium found on runner.' >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
          python -c 'import nodriver; print("nodriver import ok")'

      - name: Validate deterministic pipeline
        run: |
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          pytest --cov=property_hunt --cov-report=term-missing
          property-hunt run \
            --config config/hunt.yaml \
            --fixture-dir tests/fixtures \
            --output-dir /tmp/property-hunt-check \
            --no-browser \
            --verbose
          python scripts/validate_artifacts.py /tmp/property-hunt-check

      - name: Probe authenticated DXBinteract structure
        env:
          DXBINTERACT_USERNAME: ${{ secrets.DXBINTERACT_USERNAME }}
          DXBINTERACT_PASSWORD: ${{ secrets.DXBINTERACT_PASSWORD }}
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python scripts/probe_dxbinteract_auth.py

      - name: Run live collection
        env:
          DXBINTERACT_USERNAME: ${{ secrets.DXBINTERACT_USERNAME }}
          DXBINTERACT_PASSWORD: ${{ secrets.DXBINTERACT_PASSWORD }}
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            property-hunt run \
              --config config/hunt.yaml \
              --output-dir . \
              --verbose

      - name: Validate generated artifacts
        run: |
          python scripts/validate_artifacts.py .
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/latest.json').read_text())
          if 'counts' not in report or 'diagnostics' not in report:
              raise SystemExit('latest report is missing required run metadata')
          counts = report['counts']
          snapshot = report.get('snapshot', {})
          print(
              'live run: '
              f"collected={counts.get('collected_listings', 0)} "
              f"state={counts.get('state_listings', 0)} "
              f"transactions={counts.get('transactions', 0)} "
              f"rents={counts.get('rents', 0)} "
              f"projects={counts.get('projects', 0)} "
              f"auctions={counts.get('auctions', 0)} "
              f"market_metrics={counts.get('market_metrics', 0)} "
              f"snapshot_preserved={snapshot.get('listing_snapshot_preserved', False)}"
          )
          for diagnostic in report['diagnostics']:
              print(
                  f"source={diagnostic['source']} status={diagnostic['status']} "
                  f"records={diagnostic['records']} message={diagnostic['message']}"
              )
          PY

      - name: Persist daily state and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          if git diff --cached --quiet; then
            echo 'No generated data/report changes to commit.'
            exit 0
          fi
          git commit -m "property hunt: $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-hunt-${{ github.run_id }}
          path: |
            reports/
            data/state/
            diagnostics/
          if-no-files-found: warn
          retention-days: 3
